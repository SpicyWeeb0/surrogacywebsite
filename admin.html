<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png" />
  <link rel="icon" type="image/png" sizes="96x96" href="images/favicon-96.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png" />
  <title>Site Analytics — VitaBridge Consulting</title>
  <meta name="description" content="Internal analytics dashboard." />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; frame-src 'self' https://lookerstudio.google.com https://datastudio.google.com; upgrade-insecure-requests" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="robots" content="noindex, nofollow" />

  <!-- Firebase Compat (auth gate only, no analytics/pixel on this page) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js" integrity="sha384-sEVIly94UBRLKWdkYoPpSG7GD/e79YHMrxVyZaOk712Ga7+EAw6w1EFi+xBzBdd+" crossorigin="anonymous"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js" integrity="sha384-EkqK+ezBWJuvO3hfrSx2iVqr3YQbhmnzn8kPhOpBZ+0GMVU5oGSgptwIu8D84HjE" crossorigin="anonymous"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    (function(){
      try {
        var t = localStorage.getItem('vb-theme');
        if (!t) { t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body class="admin-page">

  <main id="adminPage">
    <section class="page-hero">
      <div class="container">
        <h1>Site Analytics</h1>
        <p>Internal dashboard — aggregate visitor data from Google Analytics (GA4). Signed-in consenting visitors only.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">

        <!-- Signed-out / unauthorized state -->
        <div id="adminSignedOut" class="account-signed-out">
          <p id="adminAuthMessage">Please log in with the admin account to view analytics.</p>
          <button type="button" class="btn btn-primary" id="adminLoginTrigger">Login</button>
        </div>

        <!-- Login modal (minimal copy of the site-wide one, scoped to this page) -->
        <div id="authModal" class="auth-modal">
          <div class="auth-modal-inner">
            <h3>Login</h3>
            <form id="authForm">
              <input type="email" id="authEmail" placeholder="Email" required />
              <input type="password" id="authPassword" placeholder="Password" required />
              <button type="submit" class="btn btn-primary" style="width:100%;">Submit</button>
              <p id="authMessage" class="auth-message"></p>
            </form>
          </div>
        </div>

        <!-- Signed-in, authorized state -->
        <div id="adminDashboard" class="admin-dashboard" hidden>

          <div class="admin-toolbar">
            <p class="account-label">Aggregate GA4 data — no visitor-identifying information is collected or shown.</p>
            <button type="button" class="btn btn-outline" id="adminLogoutBtn">Log out</button>
          </div>

          <iframe
            id="analyticsEmbed"
            class="analytics-embed"
            title="GA4 analytics report"
            loading="lazy"
            referrerpolicy="no-referrer"
          ></iframe>

        </div>
      </div>
    </section>
  </main>

  <script>
    /* ============================
       CONFIG
       ADMIN_EMAILS: the only accounts allowed to view this page.
       LOOKER_STUDIO_EMBED_URL: from Looker Studio, File > Embed report >
       Enable embedding > copy the embed URL (looks like
       https://lookerstudio.google.com/embed/reporting/<reportId>/page/<pageId>).
       The report itself should stay privately shared to each ADMIN_EMAILS
       account, not "Anyone with the link" — this page's Firebase gate only
       controls page access, not the underlying GA4 data.
    ============================ */
    const ADMIN_EMAILS = ["nikita.zakaidze@gmail.com", "d@vitabridgeconsulting.net"];
    const LOOKER_STUDIO_EMBED_URL = "https://datastudio.google.com/embed/reporting/8ed2157c-b0e0-4349-ad19-9e20a1f699bc/page/Wco4F";

    const firebaseConfig = {
      apiKey: "AIzaSyDkHrapWQGe-fo-Y_flshYrwNnTcLRSl-I",
      authDomain: "surrogacydz.firebaseapp.com",
      projectId: "surrogacydz",
      storageBucket: "surrogacydz.firebasestorage.app",
      messagingSenderId: "877548005847",
      appId: "1:877548005847:web:3f7ea1ee01f4072c404392",
      measurementId: "G-KD069RCH18",
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    const signedOutEl = document.getElementById("adminSignedOut");
    const dashboardEl = document.getElementById("adminDashboard");
    const authMessageEl = document.getElementById("adminAuthMessage");
    const authModal = document.getElementById("authModal");
    const authForm = document.getElementById("authForm");
    const authMessage = document.getElementById("authMessage");
    const analyticsEmbed = document.getElementById("analyticsEmbed");

    document.getElementById("adminLoginTrigger").addEventListener("click", () => {
      authModal.style.display = "flex";
    });
    authModal.addEventListener("click", (e) => {
      if (e.target === authModal) authModal.style.display = "none";
    });
    authForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("authEmail").value;
      const password = document.getElementById("authPassword").value;
      try {
        await auth.signInWithEmailAndPassword(email, password);
        authModal.style.display = "none";
      } catch (err) {
        authMessage.textContent = err.message;
      }
    });
    document.getElementById("adminLogoutBtn").addEventListener("click", async () => {
      await auth.signOut();
    });

    auth.onAuthStateChanged((user) => {
      if (user && user.emailVerified && ADMIN_EMAILS.includes(user.email.toLowerCase())) {
        signedOutEl.hidden = true;
        dashboardEl.hidden = false;
        if (!analyticsEmbed.src) analyticsEmbed.src = LOOKER_STUDIO_EMBED_URL;
      } else {
        dashboardEl.hidden = true;
        signedOutEl.hidden = false;
        analyticsEmbed.src = "";
        authMessageEl.textContent = user
          ? "This account is not authorized to view analytics."
          : "Please log in with the admin account to view analytics.";
      }
    });
  </script>
</body>
</html>
